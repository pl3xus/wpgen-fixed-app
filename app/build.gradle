apply plugin: 'com.android.application'

android {
    compileSdkVersion 34 // Upgraded from legacy version
    
    defaultConfig {
        applicationId "net.glsk.wpgen"
        minSdkVersion 21
        targetSdkVersion 34 // Forces modern, secure memory isolation
        versionCode 13 // Bumped up from 12 to garantee Android treats it as an update
        versionName "1.3-fixed" // Added a custom Label to know it's my patched version
    }
}

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile 'com.android.support:appcompat-v7:23.1.1' // see Android Support Library in SDK manager
}
