apply plugin: 'com.android.application'

android {
    compileSdkVersion 34
    buildToolsVersion "34.0.0" // Put back to satisfy the 2015 validation check

    defaultConfig {
        applicationId "net.glsk.wpgen"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 13
        versionName "1.3-fixed"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Swapped "implementation" to "compile" to match the 2015 syntax rules
    compile fileTree(dir: 'libs', include: ['*.jar'])
    compile 'com.android.support:support-v4:23.1.1'
}
