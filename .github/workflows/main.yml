name: Compile WPGen APK
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17 for SDK Setup
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK 25 and Auto-Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          api-level: 25
          build-tools: 25.0.3

      - name: Set up Java 8 for Legacy Gradle Execution
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Build Secure Android APK using Java 8 Target Path
        run: ./gradlew assembleDebug -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload Compiled App File
        uses: actions/upload-artifact@v4
        with:
          name: wpgen-fixed-app
          path: app/build/outputs/apk/debug/app-debug.apk
